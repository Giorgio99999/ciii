  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%, black 30%, transparent 78%);
}

.glass{
  background:linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.028));
  border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(16px);
}

.gradient-text{
  background:linear-gradient(92deg,#60A5FA 0%,#A78BFA 48%,#F472B6 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.lang-btn{
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
}

.lang-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(167,139,250,.45);
  background:rgba(255,255,255,.075);
}

.lang-btn.active{
  background:linear-gradient(135deg,#2563EB,#7C3AED);
  border-color:rgba(255,255,255,.32);
  box-shadow:0 12px 30px rgba(99,102,241,.38), inset 0 1px 0 rgba(255,255,255,.22);
}

.btn-generate{
  background:linear-gradient(92deg,#2563EB,#7C3AED 58%,#9333EA);
  box-shadow:0 14px 34px rgba(99,102,241,.42), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .2s ease, filter .2s ease, box-shadow .2s ease;
}

.btn-generate:hover:not(:disabled){
  transform:translateY(-1px) scale(1.01);
  filter:brightness(1.08);
  box-shadow:0 18px 40px rgba(99,102,241,.52);
}

.btn-generate:disabled{
  opacity:.65;
  cursor:wait;
}

.chip{
  transition:all .2s ease;
}

.chip:hover{
  border-color:rgba(167,139,250,.5);
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pulseDot{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.55;
    transform:scale(.82);
  }
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.fade-up{
  animation:fadeUp .45s ease both;
}

.fade-up-2{
  animation:fadeUp .55s ease .08s both;
}

.dot-live{
  animation:pulseDot 1.6s ease infinite;
}

.spinner{
  width:18px;
  height:18px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

.code-scroll{
  scrollbar-width:thin;
  scrollbar-color:#2A324A transparent;
}

.tok-kw{
  color:#C084FC;
}

.tok-str{
  color:#86EFAC;
}

.tok-com{
  color:#64748B;
  font-style:italic;
}

.tok-num{
  color:#FBBF24;
}

.tok-fn{
  color:#60A5FA;
}

input, textarea, select{
  color:var(--text);
}

input:focus, textarea:focus, select:focus{
  outline:2px solid rgba(139,92,246,.65);
  outline-offset:1px;
  border-color:rgba(139,92,246,.65)!important;
}

select option{
  background:#111729;
  color:#fff;
}

.placeholder\:text-slate-500::-moz-placeholder {
  --tw-text-opacity: 1;
  color: rgb(100 116 139 / var(--tw-text-opacity, 1));
}

.placeholder\:text-slate-500::placeholder {
  --tw-text-opacity: 1;
  color: rgb(100 116 139 / var(--tw-text-opacity, 1));
}

.hover\:bg-rose-500\/20:hover {
  background-color: rgb(244 63 94 / 0.2);
}

.hover\:bg-slate-200:hover {
  --tw-bg-opacity: 1;
  background-color: rgb(226 232 240 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white\/10:hover {
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:bg-white\/15:hover {
  background-color: rgb(255 255 255 / 0.15);
}

.hover\:bg-white\/20:hover {
  background-color: rgb(255 255 255 / 0.2);
}

.hover\:bg-white\/\[\.025\]:hover {
  background-color: rgb(255 255 255 / .025);
}

.hover\:text-rose-300:hover {
  --tw-text-opacity: 1;
  color: rgb(253 164 175 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
}

@media (min-width: 1024px) {
  .lg\:sticky {
    position: sticky;
  }

  .lg\:top-\[92px\] {
    top: 92px;
  }

  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_minmax\(0\2c 1\.05fr\)\] {
    grid-template-columns: minmax(0,1fr) minmax(0,1.05fr);
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
